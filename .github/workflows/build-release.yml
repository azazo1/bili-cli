name: 构建与发布

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只构建并上传 artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 解析发布上下文
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}
          fetch-depth: 0

      - name: 校验 release tag
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

          if [[ "$(git cat-file -t "refs/tags/$TAG_NAME")" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG_NAME" =~ $semver_pattern ]]; then
            echo "发布 tag 必须匹配 vX.Y.Z: $TAG_NAME" >&2
            exit 1
          fi

          version="${TAG_NAME#v}"
          notes_path="docs/changelog/$version.md"
          if [[ ! -s "$notes_path" ]]; then
            echo "缺少 release notes: $notes_path" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.platform }} ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            can_execute: true
            format_pattern: 'ELF.*x86-64'
          - platform: linux
            arch: aarch64
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04
            can_execute: false
            format_pattern: 'ELF.*ARM aarch64'
          - platform: windows
            arch: x86_64
            goos: windows
            goarch: amd64
            runner: windows-2025
            can_execute: true
          - platform: windows
            arch: aarch64
            goos: windows
            goarch: arm64
            runner: windows-2025
            can_execute: false
          - platform: macos
            arch: x86_64
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            can_execute: true
            format_pattern: 'Mach-O.*x86_64'
          - platform: macos
            arch: aarch64
            goos: darwin
            goarch: arm64
            runner: macos-15
            can_execute: true
            format_pattern: 'Mach-O.*arm64'
    steps:
      - name: 检出目标提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false

      - name: 读取 Go 缓存路径
        id: go_cache
        shell: bash
        run: |
          set -euo pipefail
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: 恢复 Go 依赖与构建缓存
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.go_cache.outputs.gomodcache }}
            ${{ steps.go_cache.outputs.gocache }}
          key: go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.arch }}-

      - name: 运行测试
        run: go test ./...

      - name: 计算产物路径
        id: artifact
        env:
          BILI_BUILD_VERSION: ${{ needs.version.outputs.tag_name }}
          BILI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/release -mode metadata \
            -target-os "${{ matrix.goos }}" \
            -target-arch "${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"

      - name: 构建二进制
        if: github.event_name != 'workflow_dispatch' && needs.version.outputs.is_release != 'true'
        env:
          BILI_BUILD_VERSION: ${{ needs.version.outputs.tag_name }}
          BILI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/release -mode build \
            -target-os "${{ matrix.goos }}" \
            -target-arch "${{ matrix.goarch }}"

      - name: 构建并打包发布归档
        if: github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true'
        env:
          BILI_BUILD_VERSION: ${{ needs.version.outputs.tag_name }}
          BILI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          go run ./scripts/release -mode dist \
            -target-os "${{ matrix.goos }}" \
            -target-arch "${{ matrix.goarch }}"

      - name: 运行可执行文件 smoke test
        if: matrix.can_execute
        env:
          BINARY_PATH: ${{ steps.artifact.outputs.binary_path }}
          BUILD_VERSION: ${{ steps.artifact.outputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$("$BINARY_PATH" --version)"
          if [[ "$actual_version" != "$BUILD_VERSION" ]]; then
            echo "版本输出为 $actual_version, 预期为 $BUILD_VERSION" >&2
            exit 1
          fi

      - name: 检查 Linux 和 macOS 二进制格式
        if: matrix.platform != 'windows'
        env:
          BINARY_PATH: ${{ steps.artifact.outputs.binary_path }}
          FORMAT_PATTERN: ${{ matrix.format_pattern }}
        shell: bash
        run: |
          set -euo pipefail
          format="$(file "$BINARY_PATH")"
          echo "$format"
          if [[ ! "$format" =~ $FORMAT_PATTERN ]]; then
            echo "目标二进制格式不匹配: $BINARY_PATH" >&2
            exit 1
          fi

      - name: 检查 Windows PE 二进制格式
        if: matrix.platform == 'windows'
        env:
          BINARY_PATH: ${{ steps.artifact.outputs.binary_path }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $binary = Resolve-Path -LiteralPath $env:BINARY_PATH -ErrorAction Stop
          $header = [System.IO.File]::ReadAllBytes($binary)
          if ($header.Length -lt 64 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "PE 文件头无效: $binary"
          }
          $peOffset = [BitConverter]::ToInt32($header, 0x3c)
          if ($header.Length -lt ($peOffset + 6) -or $header[$peOffset] -ne 0x50 -or $header[$peOffset + 1] -ne 0x45) {
            throw "PE 签名无效: $binary"
          }
          $machine = [BitConverter]::ToUInt16($header, $peOffset + 4)
          $expectedMachine = if ($env:TARGET_ARCH -eq "x86_64") { 0x8664 } else { 0xAA64 }
          if ($machine -ne $expectedMachine) {
            throw "PE 架构不匹配: $machine"
          }

      - name: 检查 tar.gz 归档
        if: (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true') && matrix.platform != 'windows'
        env:
          ARCHIVE_PATH: ${{ steps.artifact.outputs.archive_path }}
          BINARY_NAME: ${{ matrix.platform == 'windows' && 'bili.exe' || 'bili' }}
        shell: bash
        run: |
          set -euo pipefail
          entries="$(tar -tzf "$ARCHIVE_PATH")"
          if [[ "$entries" != "$BINARY_NAME" ]]; then
            echo "归档内容不正确: $ARCHIVE_PATH" >&2
            exit 1
          fi

      - name: 检查 zip 归档
        if: (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true') && matrix.platform == 'windows'
        env:
          ARCHIVE_PATH: ${{ steps.artifact.outputs.archive_path }}
        shell: pwsh
        run: |
          $archivePath = Resolve-Path -LiteralPath $env:ARCHIVE_PATH -ErrorAction Stop
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            if ($archive.Entries.Count -ne 1 -or $archive.Entries[0].FullName -ne "bili.exe") {
              throw "ZIP 归档内容不正确: $archivePath"
            }
          } finally {
            $archive.Dispose()
          }

      - name: 上传发布归档
        if: github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.artifact.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建 GitHub Release
    needs: [version, build]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi
          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 下载发布归档
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: 生成 SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          archives=(
            "bilibili-cli-$VERSION-linux-x86_64.tar.gz"
            "bilibili-cli-$VERSION-linux-aarch64.tar.gz"
            "bilibili-cli-$VERSION-windows-x86_64.zip"
            "bilibili-cli-$VERSION-windows-aarch64.zip"
            "bilibili-cli-$VERSION-macos-x86_64.tar.gz"
            "bilibili-cli-$VERSION-macos-aarch64.tar.gz"
          )
          for archive in "${archives[@]}"; do
            if [[ ! -s "$archive" ]]; then
              echo "缺少发布归档: $archive" >&2
              exit 1
            fi
          done
          if (( ${#archives[@]} != 6 )); then
            echo "发布归档数量不正确" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          checksum_count="$(wc -l < SHA256SUMS)"
          if (( checksum_count != ${#archives[@]} )); then
            echo "校验和数量不正确: $checksum_count" >&2
            exit 1
          fi

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")
          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            git fetch --force origin "refs/tags/$base_tag:refs/tags/$base_tag"
            if ! git show-ref --verify --quiet "refs/tags/$base_tag"; then
              echo "找不到 release notes 基线 tag: $base_tag" >&2
              exit 1
            fi
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body // empty' > generated-notes.md
          cp "$manual_notes" release-notes.md
          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archives=(
            "bilibili-cli-$VERSION-linux-x86_64.tar.gz"
            "bilibili-cli-$VERSION-linux-aarch64.tar.gz"
            "bilibili-cli-$VERSION-windows-x86_64.zip"
            "bilibili-cli-$VERSION-windows-aarch64.zip"
            "bilibili-cli-$VERSION-macos-x86_64.tar.gz"
            "bilibili-cli-$VERSION-macos-aarch64.tar.gz"
          )
          assets=()
          for archive in "${archives[@]}"; do
            asset="release-artifacts/$archive"
            if [[ ! -s "$asset" ]]; then
              echo "缺少发布文件: $asset" >&2
              exit 1
            fi
            assets+=("$asset")
          done
          assets+=("release-artifacts/SHA256SUMS")
          if (( ${#assets[@]} != 7 )); then
            echo "发布文件数量不正确: ${#assets[@]}" >&2
            exit 1
          fi

          title="bilibili-cli v$VERSION"
          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$title" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
